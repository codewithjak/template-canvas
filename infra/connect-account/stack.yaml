AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Mapdoc Visual Cloud Builder — connect this AWS account (P5). Creates a
  cross-account Connect role (assumable ONLY by Mapdoc, and ONLY with your
  ExternalId), an in-account Runner role + CodeBuild project that runs Terraform,
  and a durable Terraform state backend (S3 + DynamoDB). Mapdoc never receives
  your access keys — it briefly assumes the Connect role to launch the runner.

Parameters:
  PlatformAccountId:
    Type: String
    Description: Mapdoc's AWS account id (shown on the Connect screen).
    AllowedPattern: '^[0-9]{12}$'
  ExternalId:
    Type: String
    Description: One-time ExternalId shown on the Connect screen.
    MinLength: 8
    NoEcho: true
  RunnerPolicyArn:
    Type: String
    Default: arn:aws:iam::aws:policy/PowerUserAccess
    Description: >
      Permissions the Terraform runner gets in THIS account. Default is
      PowerUserAccess (broad-but-bounded; excludes IAM/root). Tighten as needed.

Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }

  LockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: LockID, AttributeType: S }
      KeySchema:
        - { AttributeName: LockID, KeyType: HASH }

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RunnerPolicyArn
      Policies:
        - PolicyName: terraform-state
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !GetAtt StateBucket.Arn
                  - !Sub '${StateBucket.Arn}/*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt LockTable.Arn

  RunnerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub 'mapdoc-runner-${AWS::StackName}'
      ServiceRole: !GetAtt RunnerRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: hashicorp/terraform:1.9
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo "Buildspec is supplied at StartBuild time by Mapdoc (plan/apply)."
      TimeoutInMinutes: 30

  ConnectRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${PlatformAccountId}:root' }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'sts:ExternalId': !Ref ExternalId }
      Policies:
        - PolicyName: launch-runner
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds, codebuild:StopBuild]
                Resource: !GetAtt RunnerProject.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RunnerRole.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt StateBucket.Arn
                  - !Sub '${StateBucket.Arn}/*'
              - Effect: Allow
                Action: [logs:GetLogEvents, logs:FilterLogEvents]
                Resource: '*'

  # Assumed by the platform to mint SHORT-LIVED, session-scoped credentials for a
  # CLI "deploy from here" (build image locally → push to ECR → roll ECS). This
  # role is the CEILING; each handed-out credential is narrowed by an inline
  # session policy to exactly one repo + one service (see backend/cloud/deploy.js).
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${PlatformAccountId}:root' }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'sts:ExternalId': !Ref ExternalId }
      Policies:
        - PolicyName: deploy-ecr-ecs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub 'arn:aws:ecr:*:${AWS::AccountId}:repository/*'
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/*'
                Condition:
                  StringEquals: { 'iam:PassedToService': 'ecs-tasks.amazonaws.com' }

Outputs:
  ConnectRoleArn:
    Description: Paste this back into Mapdoc to finish connecting.
    Value: !GetAtt ConnectRole.Arn
  DeployRoleArn:
    Description: Optional — enables CLI "deploy from here" (local image build + scoped push).
    Value: !GetAtt DeployRole.Arn
  StateBucket:
    Value: !Ref StateBucket
  LockTable:
    Value: !Ref LockTable
  RunnerProject:
    Value: !Ref RunnerProject
